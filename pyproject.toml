[project]
name = "ltv-warehouse"
version = "1.0.0"
description = "Retail Observatory: real-data retention, customer value, and promotion analytics lakehouse."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "duckdb>=1.4,<3",
    "pyarrow>=18",
    "pyreadr>=0.5",
    "plotly>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "black>=24.4",
]
app = [
    "streamlit>=1.36",
    "altair>=5.3",
]
spark = [
    "pyspark>=3.5,<4",
    "pyarrow>=15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltv"]
